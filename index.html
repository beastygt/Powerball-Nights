<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Powerball Night</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f3f9;--tx:#13151d;--pn:#fff;--mu:#566;--ac:#e8a200;--on:#1a1300;--bd:#c8cde0;--g:#dfe4f7;--pb:#d7263d;--ok:#0b8a4a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07080c;--tx:#f4f5fa;--pn:#151824;--mu:#9aa1b8;--ac:#ffc83d;--bd:#2b3046;--g:#1c2140;--pb:#e5334b;--ok:#3ddc84}}
:root[data-theme=dark]{--bg:#07080c;--tx:#f4f5fa;--pn:#151824;--mu:#9aa1b8;--ac:#ffc83d;--bd:#2b3046;--g:#1c2140;--pb:#e5334b;--ok:#3ddc84}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(90% 50% at 50% 0,var(--g),transparent) var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
#app{max-width:480px;margin:0 auto;padding:44px 16px 24px}
h1{font:900 clamp(26px,8vw,38px)/1.05 system-ui;letter-spacing:.02em;margin:.4em 0}
.sub{color:var(--mu);margin:.4em 0}
.btn{display:block;width:100%;min-height:56px;margin:10px 0;border:0;border-radius:14px;background:var(--ac);color:var(--on);font:800 18px system-ui;letter-spacing:.06em;cursor:pointer}
.btn:disabled{opacity:.4}.btn.sec{background:none;color:var(--tx);border:2px solid var(--bd)}.btn.sec.on{border-color:var(--ac);color:var(--ac)}
button:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.n{aspect-ratio:1;min-width:0;border-radius:50%;border:2px solid var(--bd);background:var(--pn);color:var(--tx);font:700 16px system-ui;cursor:pointer}
.n.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.n.pb.on{background:var(--pb);color:#fff;border-color:var(--pb)}
.row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.b{display:inline-grid;place-items:center;width:clamp(30px,9.5vw,42px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffa 0,#fff0 38%),var(--c);color:#fff;font:700 15px/1 system-ui;font-style:normal;text-shadow:0 1px 2px #0008}
.hit{box-shadow:0 0 0 3px var(--ok),0 0 14px var(--ok)}
.tk{background:var(--pn);border:2px dashed var(--ac);border-radius:16px;padding:14px;margin:12px 0}
canvas{display:block;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto}
.big{font:900 clamp(34px,11vw,52px)/1.1 system-ui}.win{color:var(--ok)}.lose{color:var(--mu)}
.sc{overflow-x:auto;margin:10px 0}.tb{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.snd{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);font:600 13px system-ui;cursor:pointer}
.bar{position:sticky;bottom:0;background:var(--bg);padding:6px 0}
.prog{height:12px;background:var(--pn);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--ac)}
.pop{animation:pop .4s}@keyframes pop{from{transform:scale(.2) translateY(-30px)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style></head><body><button class="snd" id="snd" aria-label="Toggle sound">Sound: ON</button><main id="app"></main>
<script>
const $=s=>document.querySelector(s),A=$('#app'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ri=(a,b)=>{const n=b-a+1,m=Math.floor(4294967296/n)*n,u=new Uint32Array(1);do crypto.getRandomValues(u);while(u[0]>=m);return a+u[0]%n};
const pick=k=>{const s=new Set;while(s.size<k)s.add(ri(1,35));return[...s]};
const TAG='This is a simulated Australian Powerball draw. No real ticket is purchased.';
const COL=['#e63946','#f4a261','#2a9d8f','#457b9d','#9b5de5','#e9a800','#06a77d'];
const DIV=[[7,1],[7,0],[6,1],[6,0],[5,1],[4,1],[5,0],[3,1],[2,1]],PAY=[0,2e7,96700,15950,840,231,93,59,23.7,13.7];
const f=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const S={scr:'buy',d:10,m:[4,5,6,9,11,12,17,26],p:13,price:12.6,bank:1000,ph:0};
(()=>{const q=new URLSearchParams(location.search),m=(q.get('m')||'').split(',').map(Number),p=+q.get('p'),d=+q.get('d'),c=+q.get('c'),b=+q.get('b'),h=q.get('h')=='1';
if(m.length==8&&new Set(m).size==8&&m.every(n=>n>=1&&n<=35))S.m=m.sort((x,y)=>x-y);if(p>=1&&p<=20)S.p=p;if(d>=1&&d<=1e4)S.d=Math.floor(d);if(c>0&&c<=1e3)S.price=c;if(b>=0&&b<=1e7)S.bank=b;S.ph=h?1:0})();
/* engine */
const divOf=(k,p)=>DIV.findIndex(d=>d[0]==k&&d[1]==+p)+1;
function evalT(t,pb,w,wp){const s=new Set(t),k=w.filter(n=>s.has(n)).length,p=pb==wp,h={};
const add=(m,c)=>{const d=divOf(m,p);if(d&&c>0)h[d]=(h[d]||0)+c};add(k,8-k);add(k-1,k);
let tot=0,g=0;for(const d in h){tot+=PAY[d]*h[d];g+=h[d]}return{k,p,h,tot,g}}
const cost=()=>S.price*(S.ph?20:1);
function evalX(t,pb,w,wp){if(!S.ph)return evalT(t,pb,w,wp);const a=evalT(t,wp,w,wp),b=evalT(t,0,w,wp),h={};for(const d in a.h)h[d]=a.h[d];for(const d in b.h)h[d]=(h[d]||0)+19*b.h[d];return{k:a.k,p:true,h,tot:a.tot+19*b.tot,g:a.g+19*b.g}}
function reset(){runId++;stopAll();Object.assign(S,{scr:'buy',i:0,spent:0,won:0,hist:[],dc:Array(10).fill(0),big:0,wins:0,cur:null,r:null})}
function record(i,w,r){S.won+=r.tot;if(r.tot>0)S.wins++;S.big=Math.max(S.big,r.tot);for(const d in r.h)S.dc[d]+=r.h[d];
const rs=cost()*(i+1);S.hist.push({n:i+1,m:w.m.slice().sort((a,b)=>a-b),p:w.p,k:r.k,pm:r.p,dv:Object.keys(r.h).map(d=>'D'+d+(r.h[d]>1?'×'+r.h[d]:'')).join(' ')||'—',w:r.tot,rs,rw:S.won,rn:S.won-rs})}
/* sound */
let ac,mg,on=true,hum,rt;
const ctx=()=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.connect(ac.destination)}catch(e){}}if(ac){ac.state=='suspended'&&ac.resume();mg.gain.value=on?.5:0}return ac};
const tone=(fr,t=0,d=.2,ty='sine',g=.3,f2)=>{const a=ctx();if(!a||!on)return;const o=a.createOscillator(),e=a.createGain(),s=a.currentTime+t;o.type=ty;o.frequency.setValueAtTime(fr,s);f2&&o.frequency.exponentialRampToValueAtTime(f2,s+d);e.gain.setValueAtTime(g,s);e.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(e).connect(mg);o.start(s);o.stop(s+d)};
const noise=(d=.3,g=.2,fr=1200)=>{const a=ctx();if(!a||!on)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),e=a.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=fr;e.gain.setValueAtTime(g,a.currentTime);e.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(fl).connect(e).connect(mg);s.start()};
function playMachineSound(){const a=ctx();if(!a||!on||hum)return;const o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();o.type='sawtooth';o.frequency.value=55;g.gain.value=.04;l.frequency.value=5;lg.gain.value=.025;l.connect(lg).connect(g.gain);o.connect(g).connect(mg);o.start();l.start();hum=()=>{o.stop();l.stop();hum=0};rt=setInterval(()=>noise(.09,.06,350+Math.random()*500),160)}
function stopAll(){hum&&hum();clearInterval(rt)}
const playBall=()=>{noise(.25,.25,2000);tone(220,0,.15,'square',.1,880);tone(660,.12,.2,'triangle',.25)},playMatch=()=>{tone(880,0,.12);tone(1320,.1,.25)},playPB=()=>{tone(300,0,.5,'sawtooth',.2,600);tone(900,.4,.5,'triangle',.25)},
playWin=()=>[523,659,784,1047,1319].forEach((q,i)=>tone(q,i*.12,.35,'triangle',.3)),playLose=()=>{tone(330,0,.3,'sine',.25,260);tone(220,.3,.5,'sine',.25,150)},playBuy=()=>{noise(.15,.2,3000);tone(1500,0,.05,'square',.12);tone(2000,.07,.1,'square',.12)};
$('#snd').onclick=()=>{on=!on;$('#snd').textContent='Sound: '+(on?'ON':'OFF');ctx();on||stopAll()};
/* machine */
let M={on:0,b:[]},runId=0,skip=0,tm,rs_;
function mk(pb){const W=M.W,R=W/2-4,r=R*(pb?.15:.115);M.R=R;M.r=r;M.b=[];for(let i=1;i<=(pb?20:35);i++){const a=Math.random()*6.28,d=Math.random()*(R-r)*.8;M.b.push({n:i,x:W/2+Math.cos(a)*d,y:W/2+Math.sin(a)*d,vx:(Math.random()-.5)*R,vy:(Math.random()-.5)*R,rot:0,c:pb?'#e5334b':COL[i%7]})}}
function step(dt){const{R,r,W}=M,c=W/2;dt*=RM?.3:1;
for(const b of M.b){b.vy+=R*2.4*dt;b.vx+=(Math.random()-.5)*R*22*dt;b.vy+=(Math.random()-.5)*R*22*dt;if(b.y>c+R*.3)b.vy-=R*9*dt*Math.random();
const s=Math.hypot(b.vx,b.vy),mx=R*4;if(s>mx){b.vx*=mx/s;b.vy*=mx/s}b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx/r*dt;
const dx=b.x-c,dy=b.y-c,d=Math.hypot(dx,dy);if(d>R-r){const nx=dx/d,ny=dy/d,vn=b.vx*nx+b.vy*ny;b.x=c+nx*(R-r);b.y=c+ny*(R-r);if(vn>0){b.vx-=1.85*vn*nx;b.vy-=1.85*vn*ny}}}
for(let i=0;i<M.b.length;i++)for(let j=i+1;j<M.b.length;j++){const p=M.b[i],q=M.b[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<2*r&&d>0){const nx=dx/d,ny=dy/d,o=(2*r-d)/2;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;const v=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;if(v<0){p.vx+=v*nx;p.vy+=v*ny;q.vx-=v*nx;q.vy-=v*ny}}}}
function paint(){const x=M.x,W=M.W,c=W/2,R=M.R,r=M.r;x.clearRect(0,0,W,W);let g=x.createRadialGradient(c,c*.8,R*.1,c,c,R);g.addColorStop(0,'#ffffff18');g.addColorStop(1,'#6a7bd44d');x.fillStyle=g;x.beginPath();x.arc(c,c,R,0,6.283);x.fill();
for(const b of M.b){g=x.createRadialGradient(b.x-r*.35,b.y-r*.4,r*.1,b.x,b.y,r);g.addColorStop(0,'#fff');g.addColorStop(.25,b.c);g.addColorStop(1,'#000a');x.fillStyle=g;x.beginPath();x.arc(b.x,b.y,r,0,6.283);x.fill();x.save();x.translate(b.x,b.y);x.rotate(b.rot);x.fillStyle='#fff';x.font='700 '+r*.8+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(b.n,0,r*.05);x.restore()}
x.lineWidth=5;x.strokeStyle='#cfd6ff88';x.beginPath();x.arc(c,c,R,0,6.283);x.stroke();x.strokeStyle='#ffffff66';x.lineWidth=4;x.beginPath();x.arc(c,c,R-8,3.4,4.5);x.stroke()}
function loop(t){if(!M.on)return;const dt=Math.min(.033,(t-(M.t||t))/1000);M.t=t;step(dt);paint();requestAnimationFrame(loop)}
const wait=ms=>new Promise(r=>{if(skip)return r();rs_=r;tm=setTimeout(r,RM?ms*.6:ms)});
async function play(){const id=++runId,w=S.cur,msg=$('#msg'),tray=$('#tray'),cv=$('#cv'),d=devicePixelRatio||1;skip=0;
M.W=cv.clientWidth;cv.width=cv.height=M.W*d;M.x=cv.getContext('2d');M.x.scale(d,d);mk(0);M.on=1;M.t=0;requestAnimationFrame(loop);playMachineSound();
for(let i=0;i<8;i++){const pb=i==7;msg.textContent=pb?'POWERBALL':'BALL '+(i+1);if(pb)mk(1);await wait(pb?2200:1800);if(id!=runId)return;
const n=pb?w.p:w.m[i];M.b=M.b.filter(b=>b.n!=n);tray.insertAdjacentHTML('beforeend',pb?pbBall(n,'pop'):mainBall(n,'pop'));
const hit=pb?(S.ph||S.p==n):S.m.includes(n);if(!skip)pb?playPB():hit?playMatch():playBall();
if(hit){const e=$(`[data-y="${pb?'p':n}"]`);e&&e.classList.add('hit')}msg.textContent=hit?'MATCH! '+n:n;await wait(1000);if(id!=runId)return}
await wait(700);if(id!=runId)return;M.on=0;stopAll();const r=evalX(S.m,S.p,w.m,w.p);record(S.i,w,r);S.r=r;S.scr='res';render()}
/* views */
const ball=(n,c,x='',a='')=>`<i class="b ${x}" ${a} style="--c:${c}">${n}</i>`,mainBall=(n,x='',a='')=>ball(n,COL[n%7],x,a),pbBall=(n,x='',a='')=>ball(n,'#e5334b',x,a);
const yp=(x='',a='')=>S.ph?ball('PH','#e5334b',x,a):pbBall(S.p,x,a);
const tkRow=(h)=>S.m.map(n=>mainBall(n,h?.has(n)?'hit':'')).join('')+yp(),srt=a=>a.slice().sort((x,y)=>x-y);
function render(){runId++;M.on=0;stopAll();let h='';const tot=cost()*S.d;
if(S.scr=='buy')h=`<h1>BUY A POWERBALL TICKET</h1><p class=sub>${TAG}</p>`+[1,10,100,1000,10000].map(v=>`<button class="btn sec ${S.d==v?'on':''}" data-a=d data-v=${v}>${v.toLocaleString()} ${v==1?'DRAW':'DRAWS'}</button>`).join('')+`<button class=btn data-a=nums>CONTINUE</button><button class="btn sec" data-a=share>SHARE</button>`;
else if(S.scr=='nums'){let g='',q='';for(let i=1;i<=35;i++)g+=`<button class="n ${S.m.includes(i)?'on':''}" data-a=n data-v=${i} aria-label="Number ${i}">${i}</button>`;for(let i=1;i<=20;i++)q+=`<button class="n pb ${S.p==i?'on':''}" data-a=p data-v=${i} aria-label="Powerball ${i}">${i}</button>`;
h=`<h1>CHOOSE YOUR NUMBERS</h1><p class=sub>Tap 8 numbers (${S.m.length}/8), then 1 Powerball</p><div class=grid>${g}</div><button class="btn sec ${S.ph?'on':''}" data-a=ph>${S.ph?'POWERHIT: ON':'POWERHIT: OFF'}</button><p class=sub>${S.ph?'Powerball guaranteed: your numbers play all 20 Powerballs (20 games). Simulated cost: 20× the ticket price.':'Optional: PowerHit guarantees the Powerball by playing all 20.'}</p>${S.ph?'':`<p class=sub>POWERBALL (1–20)</p><div class=grid>${q}</div>`}<div class=bar><div class=row>${tkRow()}</div><button class=btn data-a=conf ${S.m.length==8?'':'disabled'}>LOCK IN MY NUMBERS</button></div>`}
else if(S.scr=='conf')h=`<h1>YOUR TICKET</h1><div class=tk><b>AUSTRALIAN POWERBALL</b><br>SYSTEM 8${S.ph?' · POWERHIT':''}<div class=row>${tkRow()}</div></div><p>${S.d.toLocaleString()} ticket${S.d>1?'s':''} × ${f(cost())} = <b>${f(tot)}</b></p><p class=sub>Simulated bankroll ${f(S.bank)}<br>After purchase ${f(S.bank-tot)}</p><button class=btn data-a=buy>BUY TICKET</button><button class="btn sec" data-a=nums>CHANGE NUMBERS</button>`;
else if(S.scr=='draw')h=`<p class=sub>DRAW ${S.i+1} OF ${S.d}</p><canvas id=cv role=img aria-label="Lottery machine with tumbling balls"></canvas><div class=row id=tray style="min-height:46px"></div><div class=big style="font-size:28px" id=msg aria-live=polite>&nbsp;</div><p class=sub>YOUR NUMBERS</p><div class=row>${S.m.map(n=>mainBall(n,'',`data-y=${n}`)).join('')+yp('','data-y=p')}</div><button class="btn sec" data-a=skip>SKIP ANIMATION</button>`;
else if(S.scr=='fast')h=`<h1>SIMULATING ${S.d.toLocaleString()} DRAWS</h1><p class=sub>Running every draw instantly…</p><div class=prog><i id=pg></i></div>`;
else if(S.scr=='res'){const r=S.r,w=S.cur,won=r.tot>0,last=S.i+1>=S.d;
h=`<p class=sub>DRAW ${S.i+1} OF ${S.d}</p><p class=sub>WINNING NUMBERS</p><div class=row>${srt(w.m).map(n=>mainBall(n,S.m.includes(n)?'hit':'')).join('')+pbBall(w.p,r.p?'hit':'')}</div><p class=sub>YOUR NUMBERS</p><div class=row>${S.m.map(n=>mainBall(n,w.m.includes(n)?'hit':'')).join('')+yp(r.p?'hit':'')}</div><p><b>${r.k} MAIN-NUMBER MATCH${r.k==1?'':'ES'}</b><br>${S.ph?'POWERHIT (all 20 Powerballs)':r.p?'POWERBALL MATCHED':'NO POWERBALL'}</p><div class="big ${won?'win':'lose'}">${won?'YOU WON!':'NO PRIZE'}</div><div class="big ${won?'win':'lose'}" id=amt>${f(0)}</div>`+(won?`<p class=sub>${r.g} winning game${r.g>1?'s':''}<br>${Object.keys(r.h).map(d=>`Division ${d} ×${r.h[d]}: ${f(PAY[d]*r.h[d])}`).join('<br>')}<br><b>SIMULATED PRIZE</b></p>`:'')+`<p class=sub>Spent ${f(cost()*(S.i+1))} · Won ${f(S.won)} · Net ${f(S.won-cost()*(S.i+1))}</p><button class=btn data-a=next>${last?'SEE SUMMARY':'NEXT DRAW'}</button>`}
else if(S.scr=='sum'){const sp=S.spent,net=S.won-sp,dv=[];for(let d=1;d<=9;d++)dv.push(`<tr><td>Div ${d} (${DIV[d-1][0]}${DIV[d-1][1]?'+PB':''})</td><td>${S.dc[d].toLocaleString()}</td></tr>`);
const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
h=`<h1>SIMULATION COMPLETE</h1><div class="big ${net>=0?'win':'lose'}">${net>=0?'+':''}${f(net)}</div><p class=sub>NET RESULT</p><div class=sc><table class=tb>${row('Tickets bought',S.d.toLocaleString())+row('Total spent',f(sp))+row('Total won',f(S.won))+row('Remaining bankroll',f(S.bank-sp+S.won))+row('Winning tickets',S.wins.toLocaleString())+row('Zero-prize tickets',(S.d-S.wins).toLocaleString())+row('Largest win',f(S.big))+row('Avg return / ticket',f(S.won/S.d))+row('ROI',(net/sp*100).toFixed(1)+'%')}</table></div><p class=sub>Prize amounts are SIMULATED assumptions, not real dividends. System 8 = 8 games per ticket${S.ph?'; PowerHit = 20 × that':''}.</p><div class=sc><table class=tb><tr><th>Division</th><th>Winning games</th></tr>${dv.join('')}</table></div><button class=btn data-a=share>SHARE</button><button class="btn sec" data-a=reset>START AGAIN</button><h2>DRAW HISTORY</h2><div class=sc><table class=tb><tr><th>#</th><th>Winning</th><th>PB</th><th>Main</th><th>PB hit</th><th>Div</th><th>Won</th><th>Spent</th><th>Total won</th><th>Net</th></tr>${S.hist.slice(0,100).map(r=>`<tr><td>${r.n}</td><td>${r.m.join(' ')}</td><td>${r.p}</td><td>${r.k}</td><td>${r.pm?'Y':'–'}</td><td>${r.dv}</td><td>${f(r.w)}</td><td>${f(r.rs)}</td><td>${f(r.rw)}</td><td>${f(r.rn)}</td></tr>`).join('')}</table></div>${S.hist.length>100?`<p class=sub>Showing the first 100 of ${S.d.toLocaleString()} draws.</p>`:''}`}
A.innerHTML=h;scrollTo(0,0);
if(S.scr=='draw')play();
