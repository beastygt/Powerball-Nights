<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1931;color:#fff;font:14px/1.4 Arial,sans-serif}

.n.pb.on{background:#ff2d55!important;color:#fff!important;border-color:#ff2d55!important;box-shadow:0 0 0 3px #ff2d5544}
.ball{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;margin:4px;font:900 16px Arial;box-shadow:0 4px 10px rgba(0,0,0,0.4)}
.ball.white{background:#fff;color:#000;border:2px solid #fff}
.ball.orange{background:#ff8c00;color:#000;border:2px solid #ff8c00}
.ball.red{background:#ff2d55;color:#fff;border:2px solid #ff2d55}
.ball.green{background:#2fff8a;color:#000;border:2px solid #2fff8a;box-shadow:0 0 0 4px #2fff8a44,0 0 16px #2fff8a66,0 4px 10px rgba(0,0,0,0.4)}
.ball.small{width:32px;height:32px;font-size:12px;margin:2px}
.btn{border:0;border-radius:12px;padding:14px;font:800 13px Arial;width:100%;margin:6px 0;cursor:pointer}
.btn.main{background:#fff;color:#000}
.btn.sec{background:#1a3a66;color:#fff;border:2px solid #2a5a9a}
.btn.small{padding:8px 10px;font-size:11px;width:auto;display:inline-block}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sticky{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#0a1931;border-top:2px solid #1a365d;padding:10px;display:flex;gap:8px;z-index:20}
.bigNum{font:900 52px/0.9 Arial;text-align:center;margin:10px 0;word-break:break-all}
.bigNum.loss{color:#ff4d6d}
.bigNum.win{color:#2fff8a}
.sub{color:#7da0c7;font-size:10px;text-align:center;margin:6px 0;text-transform:uppercase;font-weight:800}
.sub.warn{color:#ff8c00;font-size:11px}
select{width:100%;background:#0d2242;border:2px solid #2a5a9a;color:#fff;padding:12px;border-radius:10px;font:600 12px Arial;margin-top:6px}
.ticketRow{display:flex;gap:4px;margin:6px 0;align-items:center;flex-wrap:wrap;padding:6px;border-radius:10px;background:#0d2242;border:1px solid #1a365d}
.ticketRow.best{border-color:#2fff8a;background:#0a2a1a;box-shadow:0 0 0 2px #2fff8a44}
.ticketBall{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 11px Arial;border:2px solid #2a5a9a;background:#0d2242;color:#fff}
.ticketBall.match{background:#2fff8a!important;color:#000!important;border-color:#2fff8a!important}
.ticketBall.pb{background:#2a0f1f;color:#ffb3c1;border-color:#ff6b8a}
.ticketBall.pb.match{background:#2fff8a!important;color:#000!important;border-color:#2fff8a!important}

function getEquiv(amount){
 let loss=Math.abs(Math.round(amount));
 if(loss<=0) return null;
 let best=EQUIV_ITEMS[0];
 let diff=Math.abs(loss-best.v);
 for(let it of EQUIV_ITEMS){
  let d=Math.abs(loss-it.v);
  if(d<diff){diff=d; best=it;}
  if(it.v>=loss) break;
 }
 // If loss is huge, pick closest by ratio
 if(loss>1000000){
   return {name: `a ${Math.floor(loss/1000000)}-bed mansion portfolio and a boat`, v: loss};
 }
 return best;
}

let S={scr:'title',starting:500,advanced:false,tab:'Std',sysType:'System 8',stdGames:1,sysBoards:1,phType:'PowerHit',phBoards:1,mains:[],pb:null,tickets:[],draw:{m:[],pb:null},res:{by:{},won:0,cost:0,details:[]},bal:500,debt:0,spent:0,won:0,games:0,showAll:false};
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pickN=k=>{let s=new Set();while(s.size<k)s.add(ri(1,35));return [...s].sort((a,b)=>a-b);};
const comb=(arr,k)=>{if(k===0)return[[]];if(!arr.length)return[];let h=arr[0],t=arr.slice(1);return [...comb(t,k-1).map(c=>[h,...c]),...comb(t,k)];};
let ac,mg,soundOn=true;
function ensureAudio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.connect(ac.destination);mg.gain.value=0.6;}if(ac.state==='suspended')ac.resume();}catch(e){}}
function tone(f,d=0.2,g=0.4,f2){if(!soundOn)return;ensureAudio();try{let o=ac.createOscillator(),gg=ac.createGain(),t=ac.currentTime;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gg.gain.setValueAtTime(g,t);gg.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(gg).connect(mg);o.start(t);o.stop(t+d+0.05);}catch(e){}}
function playBallPop(){if(!soundOn)return;ensureAudio();try{let t=ac.currentTime;let o1=ac.createOscillator(),g1=ac.createGain();o1.frequency.setValueAtTime(400,t);o1.frequency.exponentialRampToValueAtTime(1100,t+0.14);g1.gain.setValueAtTime(0.5,t);g1.gain.exponentialRampToValueAtTime(0.001,t+0.24);o1.connect(g1).connect(mg);o1.start(t);o1.stop(t+0.24);}catch(e){}}
function playLoseMoney(){if(!soundOn)return;ensureAudio();try{let t=ac.currentTime;for(let i=0;i<5;i++){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(700 - i*110,t+i*0.1);o.frequency.exponentialRampToValueAtTime(200 - i*20,t+i*0.1+0.3);g.gain.setValueAtTime(0.3,t+i*0.1);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.35);o.connect(g).connect(mg);o.start(t+i*0.1);o.stop(t+i*0.1+0.35);}}catch(e){}}
function playJackpot(){if(!soundOn)return;ensureAudio();try{let t=ac.currentTime;for(let i=0;i<10;i++){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(700 + i*80 + Math.random()*60,t+i*0.07);g.gain.setValueAtTime(0.3,t+i*0.07);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.07+0.18);o.connect(g).connect(mg);o.start(t+i*0.07);o.stop(t+i*0.07+0.18);} [523,659,784,1047,1318,1568].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f,t+i*0.14+0.5);g.gain.setValueAtTime(0.4,t+i*0.14+0.5);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.14+0.9);o.connect(g).connect(mg);o.start(t+i*0.14+0.5);o.stop(t+i*0.14+0.9);});}catch(e){}}
function fmtMoney(n){return '$'+Math.round(n).toLocaleString();}
function fmtMoney2(n){return '$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtNum(n){return n.toLocaleString();}
function need(){
 if(!S.advanced)return 7;
 if(S.tab==='Std')return 7;
 if(S.tab==='Sys'){
  if(S.sysType.indexOf('System')===0)return parseInt(S.sysType.split(' ')[1]);
  if(S.sysType==='Pick 5')return 5;
  if(S.sysType==='Pick 6')return 6;
 }
 if(S.tab==='PH'){
  if(S.phType==='PowerHit')return 7;
  let m=S.phType.match(/\d+/);
  return m?parseInt(m[0]):7;
 }
 return 7;
}
function totalGames(){
 if(!S.advanced)return 1;
 if(S.tab==='Std')return S.stdGames;
 if(S.tab==='Sys'){
  let baseGames=SYS[S.sysType]||8;
  // If Pick 5 or Pick 6 with extra numbers, recalc based on actual picks
  if(S.sysType==='Pick 5' || S.sysType==='Pick 6'){
   if(S.mains.length===5 && S.sysType==='Pick 5')return 435*S.sysBoards;
   if(S.mains.length===6 && S.sysType==='Pick 6')return 29*S.sysBoards;
   // If user picked 7 for Pick 6, it's 28 games per board
   if(S.sysType==='Pick 6' && S.mains.length===7)return 28*S.sysBoards;
   if(S.sysType==='Pick 5' && S.mains.length===7)return 378*S.sysBoards; // C(28,2)
  }
  return baseGames*S.sysBoards;
 }
 return (PH[S.phType]||20)*S.phBoards;
}
function isValid(){
 let n=need();
 if(!S.advanced)return S.mains.length===7 && S.pb!==null;
 if(S.tab==='Std')return S.mains.length===0 || S.mains.length===7; // Std random doesn't need picks, but if picked must be 7
 if(S.tab==='Sys'){
  if(S.sysType==='Pick 5')return S.mains.length===5 && S.pb!==null;
  if(S.sysType==='Pick 6')return (S.mains.length===6 || S.mains.length===7) && S.pb!==null;
  return S.mains.length===n && S.pb!==null;
 }
 if(S.tab==='PH')return S.mains.length===n && S.pb===null; // PowerHit doesn't need PB pick
 return false;
}
function getDiv(mm,pbM){if(mm===7&&pbM)return 1;if(mm===7)return 2;if(mm===6&&pbM)return 3;if(mm===6)return 4;if(mm===5&&pbM)return 5;if(mm===4&&pbM)return 6;if(mm===5)return 7;if(mm===3&&pbM)return 8;if(mm===2&&pbM)return 9;return 0;}

}else if(S.scr==='home'){

  h+=`<div class="card"><div class="row">`+tix[0].mains.map(n=>`<div class="ball orange">${n}</div>`).join('')+`<div class="ball red">${tix[0].pb}</div></div><div style="text-align:center;margin:10px 0"><div style="font:900 30px Arial">1 game</div><div style="font:800 18px;color:#ffd23f">${fmtMoney2(cost)}</div></div></div>`;
 }
 st=`<button class="btn sec" onclick="goHome()">Back</button>`+(S.bal>=cost?`<button class="btn main" onclick="buy()">BUY ${fmtMoney2(cost)}</button>`:`<button class="btn main" onclick="borrowBuy()">BORROW & BUY</button>`);
}else if(S.scr==='draw'){
 h+=`<div class="moneyArea"><div class="moneyRow"><span class="label">Drawing</span><span class="value">${fmtNum(S.tickets.length)} games × ${fmtMoney2(COST)}</span></div></div><canvas id="cv" width="360" height="360" style="width:100%;max-width:360px;display:block;margin:0 auto;background:#08162f;border:2px solid #1a365d;border-radius:16px"></canvas><div id="tray" class="row" style="min-height:48px"></div><div id="msg" style="font:900 18px Arial;text-align:center;min-height:24px;color:#ffd23f"></div><div id="ticketsView" style="max-height:28vh;overflow:auto;border:2px solid #1a365d;border-radius:12px;padding:8px;background:#0d2242;margin-top:8px"></div>`;
 st=`<button class="btn sec" onclick="skipDraw()">Skip →</button>`;
 setTimeout(playDraw,100);
}else if(S.scr==='result'){
 let dm=S.draw.m, dp=S.draw.pb, r=S.res; let totalRoi=S.spent?((S.won-S.spent)/S.spent*100):0;
 let isWin=r.won>0;
 h+=`<div class="card" style="background:#fff;color:#000"><div class="row">`+dm.map(n=>`<div class="ball white" style="background:#fff;color:#000;border-color:#000">${n}</div>`).join('')+`<div class="ball red" style="background:#ff2d55;color:#fff">${dp}</div></div>`;
 if(isWin){h+=`<div class="bigNum win" style="color:#16a34a">+${fmtMoney(r.won)}</div><div style="font:800 14px;text-align:center;color:#000">WIN</div>`;}else{h+=`<div class="bigNum loss">-${fmtMoney(r.cost)}</div><div style="font:800 14px;text-align:center;color:#000">LOSS</div>`;}
 // STATS ALWAYS VISIBLE AT TOP - NO SCROLL NEEDED
 h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0;text-align:center;background:#f8fafc;padding:10px;border-radius:10px;border:1px solid #e5e7eb"><div><div style="font-size:10px;color:#666">SPENT</div><div style="font:800 13px;color:#000">${fmtMoney2(r.cost)} = ${fmtNum(r.details.length)} × ${fmtMoney2(COST)}</div></div><div><div style="font-size:10px;color:#666">WON</div><div style="font:800 13px;color:#000">${fmtMoney2(r.won)}</div></div><div><div style="font-size:10px;color:#666">ROI</div><div style="font:800 13px;color:${(r.won-r.cost)>=0?'#16a34a':'#e11d48'}">${(((r.won-r.cost)/r.cost)*100).toFixed(1)}%</div></div></div>`;
 h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;background:#f8fafc;padding:10px;border-radius:10px;border:1px solid #e5e7eb"><div><div style="font-size:10px;color:#666">TOTAL SPENT</div><div style="font:700 12px;color:#000">${fmtMoney(S.spent)}</div></div><div><div style="font-size:10px;color:#666">TOTAL WON</div><div style="font:700 12px;color:#000">${fmtMoney(S.won)}</div></div><div><div style="font-size:10px;color:#666">NET</div><div style="font:800 14px;color:${S.won-S.spent>=0?'#16a34a':'#e11d48'}">${(S.won-S.spent>=0?'+':'')+fmtMoney(S.won-S.spent)}</div></div><div><div style="font-size:10px;color:#666">TOTAL ROI</div><div style="font:700 12px;color:#000">${totalRoi>=0?'+':''}${totalRoi.toFixed(1)}%</div></div><div><div style="font-size:10px;color:#666">GAMES</div><div style="font:700 12px;color:#000">${fmtNum(S.games)}</div></div><div><div style="font-size:10px;color:#666">NET WORTH</div><div style="font:700 12px;color:#000">${fmtMoney(S.bal-S.debt)}</div></div></div>`;
 // Equivalent items for losses - right after stats
 let netLoss=S.spent - S.won;
 if(netLoss>0){
   let eq=getEquiv(netLoss);
   if(eq){
     h+=`<div style="margin-top:14px;padding:12px;background:#fff3cd;border:2px dashed #ff8c00;border-radius:12px;text-align:center"><div style="font:800 11px;color:#000;letter-spacing:0.5px">YOU HAVE LOST THE EQUIVALENT OF</div><div style="font:800 14px;color:#000;margin:6px 0">${eq.name.toUpperCase()}</div><div style="font:600 10px;color:#666">Worth about ${fmtMoney(eq.v)} - you lost ${fmtMoney2(netLoss)} (incl GST)</div></div>`;
   }
 }
 let thisLoss=r.cost - r.won;
 if(thisLoss>0 && r.details.length>0){
   if(Math.abs(thisLoss - netLoss) > 5){
     let eq2=getEquiv(thisLoss);
     if(eq2){
       h+=`<div style="margin-top:10px;padding:10px;background:#ffe4e6;border:1px solid #ff4d6d;border-radius:10px;text-align:center"><div style="font:700 10px;color:#000">THIS DRAW - YOU LOST THE EQUIVALENT OF</div><div style="font:700 12px;color:#000;margin:4px 0">${eq2.name.toUpperCase()}</div></div>`;
     }
   }
 }
 // BEST GAME - always show
 if(r.details.length>0){
  let sorted=r.details.filter(d=>d.div>0).sort((a,b)=>a.div-b.div);
  let best=sorted[0];
  if(best){
   h+=`<div style="margin:14px 0;padding:12px;background:#f0fdf4;border:2px solid #2fff8a;border-radius:12px"><div style="font:800 12px;color:#16a34a;text-align:center">BEST - GAME ${best.idx+1} - ${fmtMoney(best.prize)} - DIV ${best.div} ${DIV_LABEL[best.div]}</div><div class="ticketRow" style="justify-content:center;background:transparent;border:0">`+best.mains.map(n=>`<div class="ticketBall ${dm.indexOf(n)>=0?'match':''}">${n}</div>`).join('')+`<div class="ticketBall pb ${best.pbM?'match':''}">${best.pb}</div></div></div>`;
  }
  if(sorted.length>0){
   let showBtn = sorted.length>1 ? `<button class="btn sec small" onclick="toggleExpand()" style="width:100%;margin:8px 0">${S.showAll ? '▲ HIDE WINNING GAMES' : '▼ SHOW ALL '+sorted.length+' WINNING GAMES (expand)'}</button>` : '';
   h+=showBtn;
   if(S.showAll || sorted.length<=3){
     h+=`<div style="margin:10px 0;max-height:${S.showAll ? '400px' : '200px'};overflow:auto;border:1px solid #e5e7eb;border-radius:10px;padding:6px">`;
     for(let i=0;i<sorted.length;i++){
       let d=sorted[i];
       h+=`<div class="ticketRow ${i===0?'best':''}"><span style="font-size:10px;color:#666;min-width:28px">G${d.idx+1}</span>`+d.mains.map(n=>`<div class="ticketBall ${dm.indexOf(n)>=0?'match':''}">${n}</div>`).join('')+`<div class="ticketBall pb ${d.pbM?'match':''}">${d.pb}</div><span style="font-size:10px;color:#000;margin-left:4px">DIV ${d.div} ${fmtMoney(d.prize)}</span></div>`;
     }
     h+=`</div>`;
   }else{
     // collapsed - show only best is already shown, hide rest
     h+=`<div style="text-align:center;color:#666;font-size:11px;margin:6px 0">${sorted.length-1} more winning games hidden - tap SHOW to expand</div>`;
   }
  }
 }
 h+=`</div>`;

 st=`<button class="btn sec" onclick="goBank()">Bank</button><button class="btn main" onclick="playAgain()">PLAY AGAIN</button>`;
}else if(S.scr==='bank'){
 h+=`<div class="moneyArea"><div class="moneyRow"><span class="label">Balance</span><span class="value">${fmtMoney(S.bal)}</span></div><div class="moneyRow"><span class="label">Debt</span><span class="value" style="color:#ff5a5a">${fmtMoney(S.debt)}</span></div><div class="moneyRow"><span class="label">Net Worth</span><span class="value" style="color:#2fff8a">${fmtMoney(S.bal-S.debt)}</span></div></div>`;
 h+=`<div class="card"><div class="sub">Borrow</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">`+[100,1000,10000,50000,100000,500000].map(v=>`<button class="btn sec" onclick="borrow(${v})">${fmtMoney(v)}</button>`).join('')+`</div></div>`;
 h+=`<div class="card"><div class="sub">Repay</div><button class="btn sec" onclick="repay()">Repay ${fmtMoney(Math.min(S.bal,S.debt))}</button></div>`;
 st=`<button class="btn main" onclick="goHome()">Back to Game</button>`;
}else if(S.scr==='rules'){
 h+=`<div class="card"><div class="sub">Rules - Fixed Math</div><div style="font-size:13px;line-height:1.7;color:#ccc">7 numbers 1-35 + 1 Powerball 1-20.<br><br>System 8 = 8 numbers = C(8,7)=8 games $10.80<br>System 12 = 792 games $1,069.20<br>System 20 = 77,520 games $104,652<br>Pick 5 = 5 numbers = C(30,2)=435 games $587.25<br>Pick 6 = 6 numbers = 29 games $39.15<br>Pick 6 with 7 numbers = 28 games/board<br>Cost $1.35 ex GST + 10% GST = $1.485 incl GST<br>Math: games × $1.485 = cost incl GST<br>All prices include GST<br>Orange = your pick, Red = Powerball, Green = matched</div></div>`;
 st=`<button class="btn main" onclick="goHome()">Back</button>`;
}
document.getElementById('app').innerHTML=h;
document.getElementById('sticky').innerHTML=st;
}
function setStarting(v){S.starting=v;render();}
function startGame(){S.bal=S.starting;S.debt=0;S.spent=0;S.won=0;S.games=0;S.scr='home';render();}
function goHome(){S.scr='home';render();}
function goBank(){S.scr='bank';render();}
function goRules(){S.scr='rules';render();}
function setTab(t){S.tab=t;render();}
function setStdGames(v){S.stdGames=parseInt(v);render();}
function setSysType(v){S.sysType=v;render();}
function setSysBoards(v){S.sysBoards=parseInt(v);render();}
function setPhType(v){S.phType=v;render();}
function setPhBoards(v){S.phBoards=parseInt(v);render();}
function toggleAdvanced(){S.advanced=!S.advanced;render();}
function toggleExpand(){S.showAll=!S.showAll;render();}
function playAgain(){S.mains=[];S.pb=null;S.scr='home';render();}
function toggleM(n){
 let idx=S.mains.indexOf(n);
 let willAdd=idx<0&&S.mains.length<need() && !(!S.advanced && S.mains.length>=7);
 // For Std random mode, allow up to 7 but system needs exact
 let maxNeed=need();
 if(S.tab==='Sys' && (S.sysType==='Pick 6' && S.mains.length===7 && idx<0)){
  // Allow 7 for Pick 6 special case
 }else if(S.mains.length>=maxNeed && idx<0){
  // Don't add beyond need
  return;
 }
 let willAdd2=idx<0;
 if(willAdd2){ensureAudio();playBallPop();}
 if(idx>=0)S.mains.splice(idx,1);else S.mains.push(n);
 S.mains.sort((a,b)=>a-b);render();
}
function togglePB(n){
 let willAdd=S.pb!==n;
 if(willAdd){ensureAudio();playBallPop();}
 S.pb=S.pb===n?null:n;render();
}
function quick(){
 ensureAudio();playBallPop();
 let n=need();
 S.mains=pickN(n);
 if(S.tab!=='PH')S.pb=ri(1,20);
 render();
}
function clearAll(){S.mains=[];S.pb=null;render();}
function build(){
let tix=[];
if(!S.advanced){tix.push({mains:[...S.mains],pb:S.pb});}
else if(S.tab==='Std'){
 for(let i=0;i<S.stdGames;i++){tix.push({mains:pickN(7),pb:ri(1,20)});}
}
else if(S.tab==='Sys'){
 for(let b=0;b<S.sysBoards;b++){
  let base=[...S.mains];
  let pb=S.pb||ri(1,20);
  let type=S.sysType;
  if(type.indexOf('System')===0){
   let num=parseInt(type.split(' ')[1]);
   // base must be exactly num, if not, use base as is (validated)
   let mains=base.slice(0,num);
   tix.push(...comb(mains,7).map(m=>({mains:m,pb})));
  }else if(type==='Pick 5'){
   if(base.length===5){
    let rem=[];for(let i=1;i<=35;i++)if(base.indexOf(i)<0)rem.push(i);
    let cs=comb(rem,2);
    for(let j=0;j<cs.length;j++){let arr=[...base,...cs[j]];arr.sort((a,b)=>a-b);tix.push({mains:arr,pb});}
   }else if(base.length===7){
    let rem=[];for(let i=1;i<=35;i++)if(base.indexOf(i)<0)rem.push(i);
    let cs=comb(rem,2);
    for(let j=0;j<cs.length;j++){let arr=[...base,...cs[j]];arr.sort((a,b)=>a-b);tix.push({mains:arr,pb});}
   }
  }else{ // Pick 6
   if(base.length===6){
    let rem=[];for(let i=1;i<=35;i++)if(base.indexOf(i)<0)rem.push(i);
    for(let j=0;j<rem.length;j++){let arr=[...base,rem[j]];arr.sort((a,b)=>a-b);tix.push({mains:arr,pb});}
   }else if(base.length===7){
    let rem=[];for(let i=1;i<=35;i++)if(base.indexOf(i)<0)rem.push(i);
    for(let j=0;j<rem.length;j++){let arr=[...base,rem[j]];arr.sort((a,b)=>a-b);tix.push({mains:arr,pb});}
   }
  }
 }
}
else{
 for(let b=0;b<S.phBoards;b++){
  let base=[...S.mains];
  let type=S.phType;
  if(type==='PowerHit'){
   for(let pb=1;pb<=20;pb++)tix.push({mains:base,pb});
  }else if(type.indexOf('PH ')===0&&type.indexOf('Pick')<0){
   let num=parseInt(type.split(' ')[1]);
   let mains=base.slice(0,num);
   let cs=comb(mains,7);
   for(let k=0;k<cs.length;k++){for(let pb=1;pb<=20;pb++)tix.push({mains:cs[k],pb});}
  }else if(type==='PH Pick 5'){
   let rem=[];for(let i=1;i<=35;i++)if(base.indexOf(i)<0)rem.push(i);
   let cs=comb(rem,2);
   for(let j=0;j<cs.length;j++){for(let pb=1;pb<=20;pb++){let arr=[...base,...cs[j]];arr.sort((a,b)=>a-b);tix.push({mains:arr,pb});}}
  }else{
   let rem=[];for(let i=1;i<=35;i++)if(base.indexOf(i)<0)rem.push(i);
   for(let j=0;j<rem.length;j++){for(let pb=1;pb<=20;pb++){let arr=[...base,rem[j]];arr.sort((a,b)=>a-b);tix.push({mains:arr,pb});}}
  }
 }
}
return tix;
}
function goPlay(){
 let tg=totalGames();
 if(tg===0)return;
 if(!S.advanced){
  if(S.mains.length!==7||!S.pb)return;
 }else{
  if(S.tab==='Std'){
   // always ok
  }else{
   if(!isValid())return;
  }
 }
 S.scr='confirm';render();
}
function buy(){let t=build();let cost=t.length*COST;if(S.bal<cost)return;S.bal-=cost;S.tickets=t;S.spent+=cost;S.games+=t.length;S.scr='draw';render();}
function borrowBuy(){let t=build();let cost=t.length*COST;let need=cost-S.bal;if(S.debt+need>1000000)return;S.debt+=need;S.bal+=need;S.bal-=cost;S.tickets=t;S.spent+=cost;S.games+=t.length;S.scr='draw';render();}
function borrow(v){ensureAudio();tone(700);if(S.debt+v>1000000)return;S.debt+=v;S.bal+=v;render();}
function repay(){ensureAudio();let a=Math.min(S.bal,S.debt);S.bal-=a;S.debt-=a;render();}
function toggleSnd(){soundOn=!soundOn;render();if(soundOn)ensureAudio();}
function skipDraw(){skip=true;}
let skip=false,run=0;
function playDraw(){
let cv=document.getElementById('cv');if(!cv)return;let ctx=cv.getContext('2d');let W=cv.width;let H=cv.height;
let balls=[];for(let i=1;i<=35;i++){balls.push({n:i,x:W/2+(Math.random()-0.5)*120,y:H/2+(Math.random()-0.5)*120,vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.5});}
let dm=pickN(7),dp=ri(1,20);S.draw={m:dm,pb:dp};let tray=document.getElementById('tray');let msg=document.getElementById('msg');let ticketsView=document.getElementById('ticketsView');let idx=0;let id=++run;skip=false;
function updateTicketsView(){
 if(!ticketsView)return;
 let html='';
 for(let i=0;i<Math.min(20,S.tickets.length);i++){
  let t=S.tickets[i];
  html+=`<div class="ticketRow"><span style="font-size:10px;color:#7da0c7;min-width:28px">G${i+1}</span>`;
  for(let j=0;j<t.mains.length;j++){
   let n=t.mains[j];
   let isDrawn=dm.indexOf(n)>=0 && dm.indexOf(n)<idx;
   html+=`<div class="ticketBall ${isDrawn?'match':''}">${n}</div>`;
  }
  let pbMatched=dp===t.pb && idx>=8;
  html+=`<div class="ticketBall pb ${pbMatched?'match':''}">${t.pb}</div></div>`;
 }
 ticketsView.innerHTML=html;
}
function loop(){
 ctx.fillStyle='#08162f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1a365d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,W/2-6,0,6.28);ctx.stroke();
 for(let i=0;i<balls.length;i++){let b=balls[i];b.x+=b.vx;b.y+=b.vy;if(b.x<16||b.x>W-16)b.vx*=-1;if(b.y<16||b.y>H-16)b.vy*=-1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,11,0,6.28);ctx.fill();ctx.fillStyle='#000';ctx.font='700 10px Arial';ctx.textAlign='center';ctx.fillText(b.n,b.x,b.y+3);}
 if(idx<8&&Math.random()<0.08){let n=idx===7?dp:dm[idx];for(let j=balls.length-1;j>=0;j--)if(balls[j].n===n)balls.splice(j,1);
  let isMatch=false;for(let t=0;t<S.tickets.length;t++){let tk=S.tickets[t];if(idx===7){if(tk.pb===n)isMatch=true;}else{if(tk.mains.indexOf(n)>=0)isMatch=true;}}
  let el=document.createElement('div');el.className='ball '+(isMatch?'green':(idx===7?'red':'white'));el.textContent=n;if(tray)tray.appendChild(el);if(msg)msg.textContent=idx===7?'POWERBALL '+n:'BALL '+(idx+1);
  if(soundOn){if(isMatch){tone(900,0.25);setTimeout(()=>tone(1200,0.2),80);}else{tone(420,0.1);}}
  idx++;updateTicketsView();if(idx===8){setTimeout(finish,800);return;}}
 if(id===run&&!skip)requestAnimationFrame(loop); else if(skip) finish();
}
function finish(){
 let by={},won=0,details=[];
 for(let i=0;i<S.tickets.length;i++){
  let t=S.tickets[i];let mm=0;for(let j=0;j<t.mains.length;j++)if(S.draw.m.indexOf(t.mains[j])>=0)mm++;let pbM=t.pb===S.draw.pb;let div=getDiv(mm,pbM);let prize=div?EST[div]:0;
  if(div){by[div]=(by[div]||0)+1;won+=prize;}
  details.push({idx:i,mains:t.mains,pb:t.pb,mm:mm,pbM:pbM,div:div,prize:prize});
 }
 S.res={by,won,cost:S.tickets.length*COST,details:details};S.bal+=won;S.won+=won;S.scr='result';render();
 if(soundOn){if(won>0){playJackpot();}else{playLoseMoney();}}
}
loop();
}
render();
</script>
</body>
